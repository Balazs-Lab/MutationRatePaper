# =============================================================================
# BELT Pipeline Configuration — ERR-Seq Paper (MutRatePaper)
# =============================================================================
#
# Used with: snakefiles/Pipeline.Snakefile
#
#   snakemake -s snakefiles/Pipeline.Snakefile --configfile configs/pipeline.yaml --cores 24
#   snakemake -s snakefiles/Pipeline.Snakefile --configfile configs/pipeline.yaml -n  # dry-run
#
# Pipeline steps (all paths under data/pipeline/ unless noted):
#   1  FASTQ filter          → 02-fastq_filtered
#   2  Map reads             → 03-mapped_reads
#   3  Sort/index BAM        → 04-sorted_reads
#   4  UMI map (cluster)     → 05-umi_maps          [scripts/pipeline/]
#   5  UMI group             → 06-umi_groups
#   6  Consensus call        → 07-consensus_calls
#   7  Compile consensus     → 08-compiled_consensus  (removed after step 11)
#   8  Mutation calling      → 09-mutation_calling_ERRSeq-PAPER-SAMPLES
#   9  Mutation summary      → 10-mutation_analysis_ERRSeq-PAPER-SAMPLES
#  10  Prepare analysis data  → 11-analysis            [scripts/analysis/00_prepare_data.py]
#  11  Coding mutational effects → 11-analysis/tables/ [scripts/analysis/01_coding_analysis.py]
#
# Final outputs (rule all):
#   data/pipeline/10-mutation_analysis_ERRSeq-PAPER-SAMPLES/
#     all_mutations.csv, consensus_sequence_data.csv, mutation_summary.csv, …
#   data/pipeline/11-analysis/tables/coding_mutations.csv
#   data/pipeline/11-analysis/tables/coding_summary_by_gene.csv
#   data/pipeline/11-analysis/consensus_sequence_data.csv
#
# Figure table scripts (scripts/figures/) are run manually after the pipeline.
# Sample groups and figure parameters: configs/analysis.yaml
#
# Intermediate files (BAMs, UMI CSVs, grouped BAMs) are temp() and auto-deleted when
# keep_intermediates is false. Set keep_intermediates: true for faster reruns.
# =============================================================================

# Keep large intermediate files between runs (recommended while developing).
# false = Snakemake temp() + cleanup after each stage (saves disk).
keep_intermediates: true

metadata:
