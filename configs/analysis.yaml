# -----------------------------------------------------------------------------
# Analysis parameters — organized by figure
# Script mapping:
#   Figures 1D–2B  →  scripts/analysis_scripts/00-04_*.py
#   Figures 2C–2F  →  scripts/analysis_scripts/06-09_*.py (+ 08_nucleotide_context.py)
#   Extended Data  →  scripts/analysis_scripts/04_coding_analysis.py (+ related helpers)
# -----------------------------------------------------------------------------
analysis:
  # Groups to include across all analyses.
  # Must match a 'name' in sample_groups above.
  include_groups:
    - samples

  # ── Figure 1D ─────────────────────────────────────────────────────────────
  # Total RECs recovered per sample, broken down by group and library.
  # Bar chart showing REC yield for each library (LP249, LP252, LP253) within
  # the experimental samples and ePCR controls, for cross-library QC comparison.
  figure_1d:
    groups: [samples, controls]
    library_prefixes: [LP249, LP252, LP253]

  # ── Figure 1E ─────────────────────────────────────────────────────────────
  # Bulk NL43 mutation rate, compared across experimental samples and ePCR controls,
  # broken down by library (LP249, LP252, LP253).
  # Bootstrap CI is computed per group (pooled across all libraries within the group).
  figure_1e:
    groups: [samples, controls]
    library_prefixes: [LP249, LP252, LP253]
    n_boot: 1000          # Bootstrap replicates per group
    n_recs_per_boot: 500   # RECs drawn per replicate (pooled within group)
    seed: 1
    corrected_bootstrap:
      experimental_group: samples  # group whose rate is corrected
      control_group: controls      # group subtracted as background
      # Library types group libraries that share the same amplicon.
      # Each type pools its member libraries for a matched control correction.
      # Individual per-library scopes are also produced alongside these.
      library_types:
        Env+:   [LP249, LP253]   # Env+ amplicon libraries
        GagPol: [LP252]          # GagPol amplicon library

  # ── Figure 2A ─────────────────────────────────────────────────────────────
  # Per-sample mutation count distribution across RECs.
  # Violin / box plot of mutations-per-REC stratified by sample; bootstrap CI
  # estimates the median mutation count per sample.
  figure_2a:
    groups: [samples]
    n_boot: 500
    n_recs_per_boot: 2500  # RECs drawn per replicate (per sample)
    seed: 1

  # ── Figure 2B ─────────────────────────────────────────────────────────────
  # AA Change Types across Genes.
  # Per-gene fractions of synonymous / missense / nonsense substitutions, pooled
  # across all samples in the specified group.  Substitutions only; noncoding
  # regions excluded.  Requires coding_mutations.csv from 04_coding_analysis.py.
  figure_2b:
    groups: [samples]

  # ── Figure 2C ─────────────────────────────────────────────────────────────
  # Lethal RECs Distribution by library type (Env+ vs GagPol).
  # Bootstrap estimate of the fraction of RECs carrying ≥1 deleterious coding
  # mutation (nonsense substitution OR frameshift indel OR premature stop codon),
  # stratified by library design.
  # Groups:  samples
  figure_2c:
    groups: [samples]
    n_boot: 10000          # Bootstrap replicates per library type
    n_sample_per_boot: 500 # RECs drawn per replicate (with replacement)
    seed: 42

  # ── Figure 2D ─────────────────────────────────────────────────────────────
  # Fraction of RECs with Lethal Mutation by Mutations per REC.
  # Stratified bootstrap within each mutation-count bin (0, 1, …, 9, 10+):
  # fraction of RECs in that bin carrying ≥1 deleterious coding mutation.
  # Draw size per bin = that bin's actual REC count (uncertainty tracks bin size).
  # Lethal definition: deleterious (matches Figure 2C).
  # Groups:  samples
  figure_2d:
    groups: [samples]
    n_boot: 1000  # Bootstrap replicates per bin
    seed: 42
    # draw_size: variable (= each bin's actual REC count, not a fixed n_sample)
    # This is intentional: CIs scale with bin size so that rare bins (e.g. 7 muts,
    # n=38) show wider uncertainty than common bins (e.g. 0 muts, n=15167).
    # Using a fixed draw size would make CIs artificially comparable across bins.

  # ── Figure 2E ─────────────────────────────────────────────────────────────
  # G→A dinucleotide enrichment score — pooled bootstrap.
  # Enrichment = (fraction of mutations that are G→A at context X) /
  #              (fraction of reference bases at context X).
  # Four contexts reported: GA, GG, GC, GT.
  # All samples in the group are pooled; one enrichment per context per draw.
  # Requires umi_3prime_dinucleotide_substitution_counts.csv from
  # 08_nucleotide_context.py (nucleotide_context rule).
  figure_2e:
    groups: [samples]
    n_boot: 1000          # Bootstrap replicates
    n_recs_per_boot: 500  # RECs drawn per replicate (with replacement)
    seed: 1

  # ── Figure 2F ─────────────────────────────────────────────────────────────
  # G→A dinucleotide enrichment score — stratified by mutations-per-REC group.
  # Same enrichment formula as Figure 2E, bootstrapped independently within
  # each mutation-count bin (1, 2, 3, 4, 5-9, 10+); 0-mutation RECs excluded.
  figure_2f:
    groups: [samples]
    n_boot: 1000          # Bootstrap replicates per mutation-count bin
    n_recs_per_boot: 500  # RECs drawn per replicate (with replacement)
    seed: 1

  # ── Extended Data — Coding / Lethal Analysis ──────────────────────────────
  # Per-gene enrichment of lethal coding mutations relative to a null model.
  # null_models controls which null distribution(s) are tested (can list multiple):
  #   length            — proportional to CDS nucleotide length
  #   mutation_exposure — proportional to observed coding mutation counts (recommended)
  #   length_x_exposure — combines length and exposure
  # lethal_def selects which mutations count as lethal: pipeline | deleterious | either
  lethal_enrichment:
    groups: [samples]
    null_models:
      - mutation_exposure
      - length
    lethal_def: pipeline

  # ── Extended Data — UMIset Lethal Fraction Bootstrap ──────────────────────
  # Per-UMIset fraction of lethal / deleterious coding mutations, with
  # bootstrap confidence intervals.
  umiset_bootstrap:
    groups: [samples]
    n_boot_by_gene: 500        # Draws for per-gene fraction lethal
    n_sample_size: 500         # Consensus rows per bootstrap draw
    n_boot_all_recs: 10000     # Draws for all-RECs-per-group bootstrap

# -----------------------------------------------------------------------------
# Output directories (manual figure / extended analyses)
# -----------------------------------------------------------------------------
outputs:
  prepared_data_dir: data/pipeline/11-analysis
  rec_analysis_dir: data/analysis/Main_Figures
  indel_analysis_dir: data/analysis/INDEL_Analysis
  nucleotide_context_dir: data/analysis/Nucleotide_Context
  coding_analysis_dir: data/analysis/Coding_Analysis
