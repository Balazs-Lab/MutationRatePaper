# =============================================================================
# Analysis configuration — ERRSeq Paper
# Used by Pipeline.Snakefile steps 11–12 (coding_analysis, prepare_rec_data) and manual figure scripts.
# =============================================================================
#
# Pipeline step 11 reads sample_groups from this file automatically.
#
# Figure scripts (run manually, not via Snakemake):
#   python scripts/figures/01_figure_1d.py  # etc.
#   Input: data/pipeline/11-analysis/consensus_sequence_data.csv
#
# Figure 3+ modelling: scripts/model/ (separate workflow)
# =============================================================================

metadata:
  run_label: "NL43-WT-Analyses"
  description: "ERR-Seq Paper NL43 WT samples — post-processing analysis"

# -----------------------------------------------------------------------------
# Inputs: snakefiles/Pipeline.Snakefile outputs consumed here as entry points
# These should match the output_dir values in the corresponding pipeline config
# (configs/pipeline/ERR-Seq Paper/ERR-Seq Paper Samples.yaml).
# -----------------------------------------------------------------------------
inputs:
  # Pipeline step 10 outputs
  mutation_analysis_dir: data/pipeline/10-mutation_analysis_ERRSeq-PAPER-SAMPLES

  # Pipeline step 8 outputs (used by prepare_rec_data for per-REC sequence lengths)
  compiled_consensus_dir: data/pipeline/08-compiled_consensus

  # Pipeline step 11 outputs (coding mutational effects)
  coding_data_dir: data/pipeline/11-analysis
  coding_mutations_csv: data/pipeline/11-analysis/coding_mutations.csv
  dinuc_context_data_dir: data/analysis/13-dinucleotide_context_analysis

# -----------------------------------------------------------------------------
# References
# -----------------------------------------------------------------------------
references:
  consensus_reference_dir: data/pipeline/00-consensus_reference
  biological_reference_dir: data/pipeline/00-reference_sequence
  indel_reference_fa: data/pipeline/00-consensus_reference/LP249.fa
  genbank_file: data/pipeline/00-bed_files/NL43.gb
  amplicon_coordinates_yaml: data/pipeline/00-sample-groups/amplicon_coordinates.yaml

# -----------------------------------------------------------------------------
